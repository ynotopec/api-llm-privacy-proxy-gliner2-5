{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "privacy-proxy.fullname" . }}
  labels:
    {{- include "privacy-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  INBOUND_API_KEYS: {{ required "secrets.inboundApiKeys is required when existingSecret is empty" .Values.secrets.inboundApiKeys | quote }}
  UPSTREAM_API_KEY: {{ .Values.secrets.upstreamApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
{{- end }}

